name: CI

on:
  push:
    
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Hello
        run: echo "Hello Github actions"

      - name: get code
        uses: actions/checkout@v4

      - name: Verify code
        run: |
          echo "Pulled code successfully"
          ls -al
      - name: setup python
        uses: actions/setup-python

      - name: install dependency
        run: python -m pip install -r requirements.txt

      - name: run app
        run: python app.py
        
